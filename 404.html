<!DOCTYPE html>

<html id="htmlRoot" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Page Not Found | TEKVANZA</title>
<meta content="noindex,follow" name="robots"/>
<link href="assets/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
<style>
  .error-page{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:40px 24px;
    background: radial-gradient(ellipse at 50% -10%, var(--navy-700) 0%, var(--navy-900) 55%, var(--navy-950) 100%);
  }
  .error-code{
    font-size: clamp(5rem, 15vw, 9rem);
    font-weight:800; line-height:1;
    background: linear-gradient(135deg, var(--blue-300), var(--blue-500));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:10px;
  }
  .error-title{ font-size: clamp(1.4rem, 3vw, 2rem); color:#fff; font-weight:700; margin-bottom:14px; }
  .error-text{ color: var(--grey-400); max-width:480px; margin:0 auto 32px; font-size:1rem; }
  .error-actions{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .error-logo{ width:56px; height:56px; border-radius:14px; margin:0 auto 30px; box-shadow:0 0 30px rgba(41,182,246,.4); }
</style>
</head>
<body>
<div class="error-page">
<div>
<img alt="TEKVANZA" class="error-logo" src="assets/logo-icon.jpg"/>
<div class="error-code">404</div>
<h1 class="error-title" data-ar="الصفحة غير موجودة" data-en="Page Not Found">Page Not Found</h1>
<p class="error-text" data-ar="عذرًا، الصفحة اللي بتدور عليها مش موجودة أو ممكن تكون اتنقلت." data-en="Sorry, the page you're looking for doesn't exist or may have been moved.">Sorry, the page you're looking for doesn't exist or may have been moved.</p>
<div class="error-actions">
<a class="btn btn-primary" data-ar="الرجوع للرئيسية" data-en="Back to Home" href="index.html">Back to Home</a>
<a class="btn btn-outline" data-ar="تواصل معنا" data-en="Contact Us" href="index.html#contact">Contact Us</a>
</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    var htmlRoot = document.getElementById('htmlRoot');
    var savedLang = localStorage.getItem('tekvanza_lang');
    if (savedLang === 'ar') {
      htmlRoot.setAttribute('lang', 'ar');
      htmlRoot.setAttribute('dir', 'rtl');
      document.querySelectorAll('[data-en][data-ar]').forEach(function(el){
        el.textContent = el.getAttribute('data-ar');
      });
    }
  });
</script>
</body>
</html>
